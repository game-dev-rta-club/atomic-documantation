name: Release acquisition
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acquire:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node tests/release-smoke.mjs
